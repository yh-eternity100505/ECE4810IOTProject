<style>
:root {
  --bg: #f6f1ff; --surface: #ffffff; --surface-2: #f1eaff; --text: #2a2140; --muted: #74698f; --line: #ebe3fb;
  --accent: #7c3aed; --accent-soft: #ede4ff; --on-accent: #ffffff;
  --peach: #e9692f; --peach-soft: #ffeee4; --pink: #e0457f; --pink-soft: #ffe7f0;
  --sky: #2f7fd6; --sky-soft: #e5f1ff; --mint: #1f9a68; --mint-soft: #e0f6ec; --lilac: #7c3aed; --lilac-soft: #efe7ff;
  --ok: #1f9a68; --ok-soft: #ddf5e9; --warn: #c8561b; --warn-soft: #ffecdf; --bad: #d63a55; --bad-soft: #ffe3e9;
  --off: #8b83a1; --off-soft: #efebf7;
  --hero: linear-gradient(135deg, #c7b3ff 0%, #f6b6d2 60%, #ffd0b5 100%);

  --nav-shadow: 0 -6px 24px rgba(124, 58, 237, .10);
  --twin-bg: #2b2147;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1428; --surface: #251d38; --surface-2: #30264a; --text: #f3edff; --muted: #b3a7d1; --line: #3a2f57;
    --accent: #b79cff; --accent-soft: #3b2d63; --on-accent: #1a1428;
    --peach: #ffa27d; --peach-soft: #45291f; --pink: #ff8db8; --pink-soft: #452033;
    --sky: #7db9ff; --sky-soft: #1f3150; --mint: #5fd3a2; --mint-soft: #1b3a2e; --lilac: #c4adff; --lilac-soft: #362a5c;
    --ok: #5fd3a2; --ok-soft: #1b3a2e; --warn: #ffb067; --warn-soft: #45301b; --bad: #ff7a8e; --bad-soft: #47202a;
    --off: #9c92b8; --off-soft: #2e2742;
    --hero: linear-gradient(135deg, #4b3a85 0%, #7a3d69 65%, #8a4b3c 100%);
    --shadow: 0 1px 0 rgba(255, 255, 255, .04); --nav-shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.45 ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
main { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(92px + env(safe-area-inset-bottom)); }
h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; font-weight: 800; }
h2 { font-size: 17px; color: var(--text); margin: 24px 4px 10px; font-weight: 800; }
h3 { font-size: 16px; margin: 0 0 4px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--surface); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); }
.card + .card { margin-top: 12px; }
.grid > .card, .pets > .pet-card { margin-top: 0; }  /* tiles in a row line up */
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 6px; }
.top .hello { font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 99px; background: var(--off-soft); color: var(--off); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.lilac { background: var(--lilac-soft); color: var(--lilac); }

/* Pet hero on Home */
.hero { background: var(--hero); padding: 18px; position: relative; overflow: hidden; }
.hero::after { content: "🐾"; position: absolute; right: -6px; bottom: -14px; font-size: 92px; opacity: .13; transform: rotate(-18deg); pointer-events: none; }
.hero .who { display: flex; gap: 14px; align-items: center; }
.hero .state { font-size: 22px; font-weight: 800; margin: 14px 0 2px; }
.hero ul { margin: 6px 0 0; padding-left: 18px; }
.hero .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chip { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: rgba(255, 255, 255, .7); color: #4a3d6b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip { background: rgba(0, 0, 0, .25); color: #f3edff; } }
.status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--off); }
.status-dot.ok { background: var(--ok); } .status-dot.warn { background: var(--warn); }
.avatar { width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center; font-size: 38px; background: var(--surface); box-shadow: var(--shadow); flex: none; }
.avatar.sm { width: 44px; height: 44px; border-radius: 15px; font-size: 26px; box-shadow: none; }
.av-cat { background: #ffe9d6; } .av-dog { background: #fff1c9; } .av-rabbit { background: #ffe1ee; } .av-hamster { background: #ffe7cf; }
.av-guinea_pig { background: #f3e6d8; } .av-bird { background: #dff3ff; } .av-fish { background: #d9f1ff; } .av-turtle { background: #e0f6e4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) [class*="av-"] { background: var(--surface-2); } }

/* Station tiles: one pastel colour per station */
.tile { padding: 14px; min-height: 124px; display: flex; flex-direction: column; gap: 3px; position: relative; }
.tile .label { font-size: 13px; font-weight: 700; color: var(--muted); }
.tile .value { font-size: 22px; font-weight: 800; }
.tile .icon { position: absolute; top: 10px; right: 10px; font-size: 24px; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: rgba(255, 255, 255, .65); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile .icon { background: rgba(0, 0, 0, .2); } }
.tile.eat { background: var(--peach-soft); } .tile.eat .value { color: var(--peach); }
.tile.sleep { background: var(--lilac-soft); } .tile.sleep .value { color: var(--lilac); }
.tile.water { background: var(--sky-soft); } .tile.water .value { color: var(--sky); }
.tile.toilet { background: var(--mint-soft); } .tile.toilet .value { color: var(--mint); }
.tile.active { outline: 2px solid currentColor; }
.tile.sleep.active { outline-color: var(--lilac); } .tile.toilet.active { outline-color: var(--mint); }
.tile.offline .value { color: var(--off); }
.tile.low .value { color: var(--warn); }
.bar { height: 9px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: auto; }
.tile .bar { background: rgba(255, 255, 255, .7); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile .bar { background: rgba(0, 0, 0, .25); } }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--pink)); border-radius: 99px; }
.tile.eat .bar > span { background: var(--peach); } .tile.water .bar > span { background: var(--sky); }
.bar.low > span { background: var(--warn) !important; }
.stat { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
.stat:first-of-type { border-top: 0; padding-top: 4px; }
.stat b { font-size: 18px; }
.list .item { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: flex-start; }
.list .item:first-child { border-top: 0; padding-top: 2px; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--accent); }
.dot.WARNING { background: var(--warn); } .dot.CRITICAL { background: var(--bad); } .dot.read { opacity: .25; }
.chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; position: relative; margin: 12px 0 4px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.chart .col span { width: 100%; max-width: 30px; background: linear-gradient(180deg, var(--accent), var(--pink)); border-radius: 10px 10px 4px 4px; min-height: 3px; }
.chart .col.today span { opacity: .5; }
.chart .base { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--peach); opacity: .7; }
.chart-labels { display: flex; gap: 6px; } .chart-labels div { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
.chart-wrap { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.yaxis { position: relative; height: 140px; margin: 12px 0 4px; min-width: 24px; font-size: 11px; color: var(--muted); }
.yaxis span { position: absolute; right: 0; transform: translateY(50%); white-space: nowrap; }
.chart.scaled { height: 140px; }
.chart .gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.chart .col { position: relative; z-index: 1; }
.chart .col em { font-style: normal; font-size: 10px; font-weight: 700; color: var(--muted); }
.list.scroll { max-height: 336px; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.more { width: 100%; margin-top: 8px; }
.cal-row { display: flex; align-items: stretch; background: var(--surface-2); border-radius: 14px; border: 2px solid transparent; }
.cal-row:focus-within { border-color: var(--accent); }
.cal-row input { border: 0; background: none; min-width: 0; flex: 1; }
.cal-row input:focus { border: 0; }

.cal-bowl + .cal-bowl { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }

/* Pets and reminders */
.pets { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x mandatory; }
.pet-card { flex: 0 0 116px; scroll-snap-align: start; border-radius: 20px; padding: 12px; background: var(--surface); box-shadow: var(--shadow); text-align: center; cursor: pointer; border: 2px solid transparent; color: var(--text); font-weight: 400; }
.pet-card .avatar { margin: 0 auto 8px; }
.pet-card b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pet-card.selected { border-color: var(--accent); }
.pet-card.add { display: grid; place-items: center; background: var(--surface-2); box-shadow: none; color: var(--accent); font-weight: 800; }
.avatar-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.avatar-pick button { width: 48px; height: 48px; border-radius: 15px; font-size: 26px; padding: 0; background: var(--surface-2); border: 2px solid transparent; }
.avatar-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.rem { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.rem:first-child { border-top: 0; padding-top: 2px; }
.rem .what { flex: 1; min-width: 0; }
.rem .what b { display: block; }
.due { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 99px; white-space: nowrap; background: var(--lilac-soft); color: var(--lilac); }
.due.overdue { background: var(--bad-soft); color: var(--bad); } .due.today { background: var(--peach-soft); color: var(--peach); }
.editor { margin-top: 12px; border: 2px solid var(--accent-soft); }

label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 12px 0 5px; }
input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--surface-2); border: 2px solid transparent; border-radius: 14px; padding: 11px 13px; }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); padding: 0; }
.check { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; font-weight: 400; color: var(--text); margin: 0; }
.check:first-of-type { border-top: 0; }
button { font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 11px 18px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
button.ghost { background: var(--accent-soft); color: var(--accent); }
button.danger { background: var(--bad-soft); color: var(--bad); }
button.small { padding: 8px 13px; font-size: 13px; border-radius: 12px; }
button:disabled { opacity: .5; }
.link { background: none; color: var(--accent); padding: 0; font-size: 13px; }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.code { font: 800 30px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .2em; text-align: center; padding: 14px; background: var(--surface-2); border-radius: 16px; margin-top: 12px; }
.banner { background: var(--peach-soft); color: var(--peach); border-radius: 18px; padding: 12px 14px; margin: 8px 0; font-size: 14px; font-weight: 600; }
.banner button { margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: var(--nav-shadow); display: flex; justify-content: center; padding: 6px 6px env(safe-area-inset-bottom); z-index: 5; }
nav .inner { display: flex; width: 100%; max-width: 560px; }
nav button { flex: 1; background: none; color: var(--muted); border-radius: 16px; padding: 6px 0 8px; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
nav button svg { width: 40px; height: 28px; padding: 3px 9px; border-radius: 99px; }
nav button[aria-current="page"] { color: var(--accent); }
nav button[aria-current="page"] svg { background: var(--accent-soft); }
.badge { position: absolute; top: 2px; left: calc(50% + 8px); background: var(--pink); color: #fff; font-size: 10px; font-weight: 800; border-radius: 99px; min-width: 18px; padding: 1px 5px; }
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--hero); }
.login .card { width: 100%; max-width: 380px; }
.hidden { display: none !important; }
.twin-card { padding: 0; overflow: hidden; }

.twin-canvas canvas { display: block; width: 100%; height: 100%; }
.twin-state { position: absolute; left: 10px; right: 10px; top: 10px; background: rgba(43, 33, 71, .85); color: #f3edff; border-radius: 14px; padding: 8px 12px; font-size: 13px; font-weight: 700; pointer-events: none; }
.twin-tools { display: flex; gap: 8px; align-items: center; padding: 10px 12px; flex-wrap: wrap; }
.twin-tools label { margin: 0 0 0 auto; display: flex; gap: 6px; align-items: center; color: var(--text); font-size: 13px; }
.twin-tools input[type=checkbox] { width: 18px; height: 18px; }
.error { color: var(--bad); font-size: 14px; margin-top: 10px; min-height: 1em; }
.error.step { color: var(--muted); }
/* Settings: one collapsible card per section */
details.section { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); margin-top: 12px; overflow: hidden; }
details.section > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }

.settings-title { margin: 6px 4px 2px; }

<section id="login" class="login hidden">
  <form class="card" id="login-form">
    <div class="row"><img src="/icon.svg" alt="" width="40" height="40"><h1>PetCare AI</h1></div>
    <p class="muted small" style="margin-top:6px">Sign in to see how your furry friend is doing 🐾</p>
    <label for="lu">Username</label><input id="lu" autocomplete="username" required>
    <label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
    <div class="actions"><button type="submit" style="width:100%">Sign in</button></div>
    <p class="error" id="login-error"></p>
    <p class="muted small" style="margin-top:6px">🔐 Your password never leaves this phone. It is checked with a challenge–response, then everything is encrypted with EDC + HMAC.</p>
  </form>
</section>

<div id="app" class="hidden">
  <main>
    <div class="top"><div><p class="hello" id="hello">Hello!</p><h1 id="title">PetCare AI</h1></div><span class="pill" id="link-pill">…</span></div>
    <div id="view"></div>
  </main>
  <nav><div class="inner" id="nav"></div></nav>
</div>
<div class="toast" id="toast"></div>

<script src="/edc.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICONS = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  twin: '<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',
  activity: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  alerts: '<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21h4"/>',
  access: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
};
const TABS = [["home","Home"],["twin","3D"],["activity","Activity"],["alerts","Alerts"],["settings","Settings"]];
const GESTURES = {PASS_BY: "Walked past", APPROACH_STAY: "Waited at the door", AUTH_GESTURE: "Unlock gesture", ACCESS_GRANTED: "Access granted", ACCESS_CANCELLED: "Unlock cancelled"};
const PLACES = {eat: "food bowl", water: "water bowl", sleep: "bed", toilet: "litter box"};
const AVATARS = {cat: "🐱", dog: "🐶", rabbit: "🐰", hamster: "🐹", guinea_pig: "🐭", bird: "🐦", fish: "🐠", turtle: "🐢"};
const STATION = {eat: "🥣", sleep: "🛏️", water: "💧", toilet: "🧻"};
const KINDS = {vaccination: ["💉", "Vaccination"], vet: ["🩺", "Vet check-up"], grooming: ["✂️", "Grooming"], medicine: ["💊", "Medicine"], parasite: ["🐛", "Flea / worming"], other: ["📌", "Other"]};
const FACINGS = [[0, "↑ Back"], [45, "↗ Back-right"], [90, "→ Right"], [135, "↘ Front-right"], [180, "↓ Front"], [-135, "↙ Front-left"], [-90, "← Left"], [-45, "↖ Back-left"]];
const REPEATS = {0: "Doesn't repeat", 7: "Every week", 14: "Every 2 weeks", 30: "Every month", 90: "Every 3 months", 180: "Every 6 months", 365: "Every year"};
const avatar = (a, size = "") => `<span class="avatar ${size} av-${esc(a)}">${AVATARS[a] || "🐾"}</span>`;
function age(birthday) {
  if (!birthday) return "";
  const b = new Date(birthday + "T12:00"), n = new Date();
  let months = (n.getFullYear() - b.getFullYear()) * 12 + n.getMonth() - b.getMonth() - (n.getDate() < b.getDate() ? 1 : 0);
  if (months < 1) return `${Math.max(0, Math.floor((n - b) / 604800000))} wk`;
  return months < 12 ? `${months} mo` : `${Math.floor(months / 12)} yr${months % 12 ? ` ${months % 12} mo` : ""}`;
}
function petChips(p) {
  return [p.breed || p.animal, age(p.birthday), p.weight_kg ? `${p.weight_kg} kg` : "", p.sex === "female" ? "♀ Girl" : p.sex === "male" ? "♂ Boy" : ""]
    .filter(Boolean).map((c) => `<span class="chip">${esc(c)}</span>`).join("");
}
function dueBadge(days) {
  if (days < 0) return `<span class="due overdue">${-days} day${days === -1 ? "" : "s"} overdue</span>`;
  if (days === 0) return '<span class="due today">Today</span>';
  return `<span class="due">${days === 1 ? "Tomorrow" : `In ${days} days`}</span>`;
}
function greeting() { const h = new Date().getHours(); return h < 12 ? "Good morning ☀️" : h < 18 ? "Good afternoon 🌤️" : "Good evening 🌙"; }
const CONDITIONS = {level: "A bowl is running low", zone_silent: "A sensor isn't responding", service_offline: "Sensors are offline"};
let tab = "home", status = null, settings = null, accessKey = "";

// ---------- helpers ----------
// After sign-in every request and response is an EDC_PACKET (EDC cipher + HMAC-SHA256, timestamp, one-time nonce).
// The session keys were derived on this phone at login and kept for this tab only.
let channel = null;
try { const saved = sessionStorage.getItem("petcare_channel"); if (saved) channel = EDC.Channel.load(saved); } catch { channel = null; }
function forgetChannel() { channel = null; try { sessionStorage.removeItem("petcare_channel"); } catch {} }
async function api(path, body) {
  if (path === "/api/session") return (await fetch(path, {credentials: "same-origin"})).json();
  if (!channel) { showLogin(); throw new Error("Please sign in"); }
  const request = channel.encode({type: "API_REQUEST", method: body === undefined ? "GET" : "POST", path, body});
  const response = await fetch("/api/secure", {method: "POST", credentials: "same-origin",
    headers: {"Content-Type": "application/json", "X-PetCare": "1"}, body: JSON.stringify(request)});
  const packet = await response.json().catch(() => ({}));
  if (response.status === 401) { forgetChannel(); showLogin(); throw new Error("Please sign in"); }
  if (!response.ok) throw new Error(packet.error || "Something went wrong");
  const reply = channel.decode(packet);
  const exchange = {path: path.split("?")[0], time: new Date(), request, response: packet};
  channel.stats.last = exchange;
  if (exchange.path !== "/api/status") channel.stats.lastAction = exchange;
  if (reply.status === 401) { forgetChannel(); showLogin(); throw new Error("Please sign in"); }
  if (reply.status >= 400) throw new Error((reply.data && reply.data.error) || "Something went wrong");
  return reply.data;
}
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); }
function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return new Date(iso).toLocaleDateString(undefined, {day: "numeric", month: "short"});
}
function dur(seconds) {
  seconds = Math.round(seconds || 0);
  if (seconds < 60) return `${seconds} s`;
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60);
  return h ? `${h} h ${m} min` : `${m} min`;
}
const hours = (h) => `${(h || 0).toFixed(1)} h`;
const dayLabel = (iso) => new Date(iso + "T12:00").toLocaleDateString(undefined, {weekday: "short"}).slice(0, 2);
async function guard(button, fn) { button.disabled = true; try { await fn(); } catch (e) { toast(e.message); } finally { button.disabled = false; } }

// ---------- session ----------
function showLogin() { $("app").classList.add("hidden"); $("login").classList.remove("hidden"); }
function showApp() { $("login").classList.add("hidden"); $("app").classList.remove("hidden"); go(tab); refresh(); }
$("login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("login-error").textContent = "";
  const button = event.submitter || event.target.querySelector("button");
  button.disabled = true;
  const note = $("login-error");
  try {
    channel = await EDC.login($("lu").value.trim(), $("lp").value, (step) => { note.textContent = step; note.classList.add("step"); });
    try { sessionStorage.setItem("petcare_channel", channel.save()); } catch {}
    $("lp").value = ""; note.textContent = ""; showApp();
  } catch (e) { note.classList.remove("step"); note.textContent = e.message; }
  finally { button.disabled = false; }
});

// ---------- navigation ----------
$("nav").innerHTML = TABS.map(([id, name]) => `<button data-tab="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]}</svg>${name}${id === "alerts" ? '<span class="badge hidden" id="badge"></span>' : ""}</button>`).join("");
$("nav").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) go(b.dataset.tab); });
function go(name) {
  if (tab === "twin" && twin) twin.unmount();  // stop drawing while the 3D tab is hidden
  tab = name; accessKey = "";
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === name ? "page" : "false"));
  ({home: renderHome, twin: loadTwin, activity: loadActivity, alerts: loadAlerts, access: renderAccess, settings: loadSettings})[name]();
  window.scrollTo(0, 0);
}

// ---------- polling ----------
async function refresh() {
  try { status = await api("/api/status"); } catch { return; }
  $("title").textContent = "PetCare AI";
  $("hello").textContent = greeting();
  const pill = $("link-pill");
  const live = status.link.configured;
  pill.textContent = live ? "● Live" : status.link.connected ? "Connecting…" : "Offline";
  pill.className = "pill " + (live ? "ok" : status.link.connected ? "warn" : "");
  const badge = $("badge");
  badge.textContent = status.alerts.unread; badge.classList.toggle("hidden", !status.alerts.unread);
  if (tab === "home") renderHome();
  if (tab === "twin") updateTwin();
  if (tab === "activity" && liveOn) updateLive();
  if (tab === "access") renderAccess();
  if (tab === "settings" && $("mirror-state")) $("mirror-state").innerHTML = mirrorStates();
  if (tab === "settings" && $("sec-panel") && !document.activeElement?.closest?.("#sec-panel")) securityPanel();
  if (tab === "settings") document.querySelectorAll("[data-live]").forEach((el) => {
    const z = status.zones.find((x) => x.sensor_id === el.dataset.live);
    el.textContent = z && z.online ? `${z.distance_cm.toFixed(1)} cm` : "no reading";
  });
}
setInterval(() => { if (!document.hidden && !$("app").classList.contains("hidden")) refresh(); }, 2000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("app").classList.contains("hidden")) refresh(); });

// ---------- home ----------
function overall(s) {
  if (!s.link.connected) return ["off", "Sensors offline", ["The sensor script isn't connected to the hub. Monitoring is paused."]];
  if (!s.link.configured) return ["off", "Connecting…", ["Waiting for the Raspberry Pi to confirm the sensor setup."]];
  const issues = [...new Set(s.active_conditions.map((c) => CONDITIONS[c]).filter(Boolean))];
  if (issues.length || s.alerts.critical) return ["warn", "Needs attention", issues.length ? issues : ["Check the Alerts tab."]];
  return ["ok", "All normal", []];
}
function doing(s) {
  const zone = (mode) => s.zones.find((z) => z.mode === mode && z.presence);
  const bed = zone("sleep"), box = zone("toilet");
  if (bed) return `Resting in bed · ${dur(bed.since_seconds)}`;
  if (box) return "Using the litter box right now";
  if (s.last_visit) return `Last seen at the ${PLACES[s.last_visit.mode]} ${ago(s.last_visit.timestamp)}`;
  return "No visits recorded yet";
}
function tile(z) {
  let value, note = "", cls = "", bar = "";
  if (!z.online) { value = "No reading"; cls = "offline"; note = "Check sensor " + z.sensor_id; }
  else if (z.mode === "eat" || z.mode === "water") {
    if (z.level_percent === null) { value = "Set up"; note = "Calibrate in Settings"; }
    else {
      const low = z.level_percent < 30;
      value = `${z.level_percent}%`; note = low ? "Refill soon" : "Level OK"; cls = low ? "low" : "";
      bar = `<div class="bar ${low ? "low" : ""}"><span style="width:${z.level_percent}%"></span></div>`;
    }
  } else if (z.presence) { value = z.mode === "sleep" ? "Resting" : "In use"; note = dur(z.since_seconds); cls = "active"; }
  else { value = "Empty"; note = "Nobody here"; }
  return `<div class="card tile ${z.mode} ${cls}"><span class="icon">${STATION[z.mode]}</span><div class="label">${esc(z.name)}</div><div class="value">${esc(value)}</div><div class="muted small">${esc(note)}</div>${bar}</div>`;
}
function renderHome() {
  const s = status;
  if (!s) { $("view").innerHTML = '<p class="muted" style="padding:20px 4px">Loading…</p>'; return; }
  const [tone, state, reasons] = overall(s);
  const p = s.pet, t = s.today, y = s.yesterday, g = s.last_gesture;
  const sleepPct = Math.min(100, (t.sleep_hours / p.baseline_sleep_hours) * 100);
  const gestureLine = s.gesture.online ? (s.gesture.state === "RECORDING" ? "Reading a movement…" : s.gesture.state === "CLASSIFYING" ? "Checking the movement…" : "Watching the door") : "Entrance sensor offline";
  $("view").innerHTML = `
    <div class="card hero">
      <div class="who">${avatar(p.avatar)}<div><h1>${esc(p.name)}</h1><div class="chips">${petChips(p)}</div></div></div>
      <p class="state"><span class="status-dot ${tone}"></span>${esc(state)}</p>
      <p>${esc(tone === "off" ? reasons[0] : doing(s))}</p>
      ${tone === "warn" ? `<ul>${reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
    </div>
    ${s.reminders_due.length ? `<h2>Care reminders</h2><div class="card">${s.reminders_due.slice(0, 3).map((r) => `
      <div class="rem">${avatar(r.pet_avatar, "sm")}<div class="what"><b>${KINDS[r.kind][0]} ${esc(r.title)}</b><span class="muted small">${esc(r.pet_name)} · ${esc(r.due)}</span></div>${dueBadge(r.days_left)}</div>`).join("")}
      <div class="actions"><button class="ghost small" onclick="go('settings')">Manage reminders</button></div></div>` : ""}
    <h2>Right now</h2>
    <div class="grid">${s.zones.map(tile).join("")}</div>
    <h2>Today</h2>
    <div class="card">
      <div class="stat"><span>Sleep</span><span><b>${hours(t.sleep_hours)}</b> <span class="muted small">/ usual ${hours(p.baseline_sleep_hours)}</span></span></div>
      <div class="bar" style="margin:2px 0 6px"><span style="width:${sleepPct}%"></span></div>
      <div class="stat"><span>Litter box visits</span><span><b>${t.toilet_visits}</b> <span class="muted small">/ usual ${p.baseline_toilet_visits}</span></span></div>
      <div class="stat"><span>Yesterday's wellness</span><span>${y && y.score !== null ? `<b>${y.score}</b> <span class="muted small">${esc(y.status.toLowerCase())}</span>` : '<span class="muted small">Needs a full day of data</span>'}</span></div>
    </div>
    ${s.pets.length > 1 ? `<h2>My pets</h2><div class="pets">${s.pets.map((x) => `
      <button class="pet-card ${x.id === s.monitored_pet ? "selected" : ""}" onclick="go('settings')">${avatar(x.avatar)}<b>${esc(x.name)}</b><span class="muted small">${x.id === s.monitored_pet ? "📡 Monitored" : esc(x.animal || "")}</span></button>`).join("")}</div>` : ""}
    <h2>Entrance</h2>
    <div class="card row between">
      <div><h3>${esc(gestureLine)}</h3><p class="muted small">${g ? `Last: ${esc(GESTURES[g.prediction] || g.prediction)} · ${ago(g.timestamp)}` : "No movements yet"}</p></div>
      <span class="pill ${s.gesture.online ? "ok" : ""}">${s.gesture.online ? "On" : "Off"}</span>
    </div>
    <p class="muted small" style="margin:14px 4px 0">Presence sensors estimate where your pet is; they can't confirm eating, drinking or sleep. Not a veterinary diagnosis.</p>`;
}

// ---------- 3D prototype ----------
let twin = null;
async function loadTwin() {
  $("view").innerHTML = `
    <h2>Prototype · live 3D</h2>
    <div class="card twin-card">
      <div class="twin-canvas" id="twin-canvas"><div class="twin-state" id="twin-state">Loading the 3D model…</div></div>
      <div class="twin-tools">
        <button class="ghost small" data-twin-view="perspective">Perspective</button>
        <button class="ghost small" data-twin-view="top">Top view</button>
        <label><input type="checkbox" id="twin-labels" checked> Labels</label>
      </div>
    </div>
    <p class="muted small" style="margin:10px 4px">Drag to rotate · pinch or scroll to zoom · two fingers or right-drag to pan.
      The pet appears where the sensors detect it (faded = last place seen). Sensor lights: green = pet detected, teal = OK, red = no reading.
      Positions and sizes are approximate.</p>`;
  try {
    twin = twin || await import("/twin.js");
    if (tab !== "twin") return;
    twin.mount($("twin-canvas"));
  } catch (e) {
    $("twin-state").textContent = "The 3D view could not start on this device (" + e.message + ").";
    return;
  }

}
function updateTwin() {
  if (!twin || !status || !$("twin-state")) return;
  const shown = twin.update(status);
  const where = doing(status);
  $("twin-state").textContent = !status.link.connected ? "Sensors offline · showing the last known state"
    : shown === "live" ? where : shown === "last" ? where + " (faded)" : "Not at the bed or litter box right now";
}

// ---------- activity ----------
function axisTicks(maxValue, whole) {
  // Up to five round steps (1, 2, 2.5 or 5 x 10^n); whole-number steps for counts.
  const raw = Math.max(maxValue, whole ? 1 : 0.1) / 5, power = 10 ** Math.floor(Math.log10(raw)), n = raw / power;
  let step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * power;
  if (whole) step = Math.max(1, Math.ceil(step));
  const top = step * Math.ceil(maxValue / step - 1e-9) || step;
  return Array.from({length: Math.round(top / step) + 1}, (_, i) => +(i * step).toFixed(2));
}
const tick = (v) => Number.isInteger(v) ? String(v) : v.toFixed(1);
function chart(days, key, baseline, fmt, unit = "") {
  // Axis covers both the data and the usual value.
  const whole = days.every((d) => Number.isInteger(d[key])) && Number.isInteger(baseline);
  const ticks = axisTicks(Math.max(baseline, ...days.map((d) => d[key])), whole), top = ticks[ticks.length - 1];
  const pct = (v) => Math.min(100, (v / top) * 100);
  return `<div class="chart-wrap">
    <div class="yaxis">${ticks.map((t) => `<span style="bottom:${pct(t)}%">${tick(t)}${t === top ? unit : ""}</span>`).join("")}</div>
    <div><div class="chart scaled">${ticks.slice(1).map((t) => `<div class="gridline" style="bottom:${pct(t)}%"></div>`).join("")}
      <div class="base" style="bottom:${pct(baseline)}%" title="usual"></div>${days.map((d, i) =>
      `<div class="col ${i === days.length - 1 ? "today" : ""}" title="${esc(fmt(d[key]))}"><em>${d[key] ? tick(Math.round(d[key] * 10) / 10) : ""}</em><span style="height:${pct(d[key])}%"></span></div>`).join("")}</div>
    <div class="chart-labels">${days.map((d) => `<div>${dayLabel(d.day)}</div>`).join("")}</div></div></div>`;
}
// Recent lists: 5 rows, "Show more" expands to 10 in a scrolling box.
const expanded = {visits: false, gestures: false};
function shortList(id, items, row, empty) {
  if (!items.length) return `<div class="card"><p class="muted">${empty}</p></div>`;
  const open = expanded[id], shown = items.slice(0, open ? 10 : 5);
  const toggle = items.length > 5 ? `<button class="ghost small more" data-more="${id}">${open ? "Show less" : `Show more (${Math.min(10, items.length)})`}</button>` : "";
  return `<div class="card"><div class="list ${open ? "scroll" : ""}">${shown.map(row).join("")}</div>${toggle}</div>`;
}
async function loadActivity() {
  $("view").innerHTML = '<p class="muted" style="padding:20px 4px">Loading…</p>';
  let a; try { a = await api("/api/activity?days=7"); } catch (e) { return; }
  if (tab !== "activity") return;
  $("view").innerHTML = `
    <div id="routine" style="margin-top:14px"><div class="card"><p class="muted">Loading the wellness model…</p></div></div>
    <h2>Sleep · last 7 days</h2>
    <div class="card">${chart(a.days, "sleep_hours", a.baseline.sleep_hours, hours, " h")}<p class="muted small">Hours per day. Dashed line: usual ${hours(a.baseline.sleep_hours)}. Today is lighter because it isn't finished.</p></div>
    <h2>Litter box visits · last 7 days</h2>
    <div class="card">${chart(a.days, "toilet_visits", a.baseline.toilet_visits, (v) => `${v} visits`)}<p class="muted small">Visits per day. Dashed line: usual ${a.baseline.toilet_visits} a day.</p></div>
    <h2>Recent visits</h2><div id="list-visits"></div>
    <h2>Entrance</h2><div id="list-gestures"></div>`;
  const lists = {
    visits: () => shortList("visits", a.visits, (v) => `<div class="item"><div style="flex:1"><b>${v.mode === "sleep" ? "🛏️ Rested in bed" : "🧻 Used the litter box"}</b><p class="muted small">${dur(v.duration)}</p></div><span class="muted small">${ago(v.timestamp)}</span></div>`, "No visits yet."),
    gestures: () => shortList("gestures", a.gestures, (g) => `<div class="item"><div style="flex:1"><b>${esc(GESTURES[g.prediction] || g.prediction)}</b></div><span class="muted small">${ago(g.timestamp)}</span></div>`, "No entrance activity yet."),
  };
  const draw = (id) => {

let liveOn = false, liveBusy = false, liveRestart = false, wbInfo = false, tuneOpen = false;
// Slider range per unit: hours, bowl %, counts.
const TUNE_RANGE = {h: [3, 0.1], "%": [25, 1], "": [5, 0.5]};
const fmtTol = (v, unit) => `±${(+v).toFixed(unit === "h" ? 1 : unit === "%" ? 0 : 1)}${unit}`;
// The score uses whichever is bigger: the tolerance set here or the spread it learned.
const tolLabel = (v, learned, unit) => +v > learned ? fmtTol(v, unit) : `${fmtTol(learned, unit)} (learned)`;
function tuneRow(f) {
  const [max, step] = TUNE_RANGE[f.unit] || [10, 0.5];
  return `<div class="tune-row"><div class="row"><span>${esc(f.label)}</span><b id="tv-${f.key}">${tolLabel(f.tolerance, f.learned_std, f.unit)}</b></div>
    <input type="range" data-tune="${f.key}" data-unit="${esc(f.unit)}" data-learned="${f.learned_std}" min="0" max="${max}" step="${step}" value="${f.tolerance}">
    <p class="muted small">Learned from the normal days: ${fmtTol(f.learned_std, f.unit)} · usual ${f.usual}${esc(f.unit)}</p></div>`;
}

    $("live-out").innerHTML = `

        <span>🧻 Litter visits <b>${v.litter_visits.value}</b></span><span>🚪 Entrance <b>${v.entrance_events.value}</b></span>

const rtColour = (v) => v >= 70 ? "var(--ok)" : v >= 50 ? "var(--warn)" : "var(--bad)";
// One bar: AI wellness (coloured) drawn over the old formula (grey band ending at a marker).

function wellBar(d) {

}
const whyText = (d) => d.reasons.length ? d.reasons.map((r) => `${r.label} ${r.z > 0 ? "+" : ""}${r.z}σ`).join(" · ") : "Close to the usual routine";

const SECTION_ICONS = {"My pets": "🐾", "Care reminders": "⏰", "Food & water calibration": "🥣", "Notifications": "🔔", "Telegram": "✈️",
  "Sensors": "📡", "Sensor locations": "📍", "Developer dashboard": "💻", "Encrypted channel": "🔐", "Account": "👤"};

try { openSections = new Set(JSON.parse(localStorage.getItem("petcare_open_sections") || '["My pets"]')); } catch { openSections = new Set(["My pets"]); }
function sectionHint(title, s) {
  const today = new Date(new Date().toDateString());
  switch (title) {
    case "My pets": { const m = s.pets.find((x) => x.id === s.monitored_pet); return [`${s.pets.length} pet${s.pets.length === 1 ? "" : "s"} · ${m ? m.name : "?"} monitored`]; }
    case "Care reminders": {
      const overdue = s.reminders.filter((r) => new Date(r.due + "T00:00") < today).length;
      return overdue ? [`${overdue} overdue`, true] : [s.reminders.length ? `${s.reminders.length} upcoming` : "None yet"];
    }
    case "Food & water calibration": {
      const bowls = Object.entries(s.sensors.mapping).filter(([, m]) => m === "eat" || m === "water"), done = bowls.filter(([id]) => s.calibration[id]).length;
      return done < bowls.length ? [`${bowls.length - done} bowl${bowls.length - done > 1 ? "s" : ""} need calibrating`, true] : [`${done} of ${bowls.length} calibrated`];
    }
    case "Notifications": { const v = Object.values(s.notifications); return [`${v.filter(Boolean).length} of ${v.length} on`]; }
    case "Telegram": return [s.telegram.enabled && s.telegram.has_token ? "On" : "Off"];
    case "Sensors": return [Object.entries(s.sensors.mapping).map(([id, m]) => `S${id} ${s.modes[m].split(" ")[0]}`).join(" · ") + " · S5 Entrance"];
    case "Sensor locations": return ["Where each sensor sits (3D view)"];
    case "Developer dashboard": {
      const st = status ? status.mirror.states : [];
      return [s.mirror.hosts.length ? `${s.mirror.hosts.length} laptop${s.mirror.hosts.length > 1 ? "s" : ""} · ${st.filter((x) => x.live).length} live` : "Off"];
    }
    case "Encrypted channel": return [channel ? `EDC + HMAC · ${channel.stats.verified} packets verified` : "EDC + HMAC"];
    case "Account": return status && status.must_change_password ? ["Default password: change it", true] : ["Password and sign out"];
  }
  return [""];
}

    <div class="grid"><div><label for="rp">Pet</label><select id="rp">${s.pets.map((x) => `<option value="${x.id}" ${x.id === r.pet_id ? "selected" : ""}>${AVATARS[x.avatar]} ${esc(x.name)}</option>`).join("")}</select></div>
      <div><label for="rk">Type</label><select id="rk">${Object.entries(KINDS).map(([k, [e, n]]) => `<option value="${k}" ${k === r.kind ? "selected" : ""}>${e} ${n}</option>`).join("")}</select></div></div>
    <label for="rt">Title</label><input id="rt" value="${esc(r.title || KINDS[r.kind][1])}" maxlength="60" required>
    <div class="grid"><div><label for="rd">Due date</label><input id="rd" type="date" value="${esc(r.due)}" required></div>
      <div><label for="rr">Repeat</label><select id="rr">${Object.entries(REPEATS).map(([d, n]) => `<option value="${d}" ${+d === r.repeat_days ? "selected" : ""}>${n}</option>`).join("")}</select></div></div>
    <label for="rn">Notes</label><textarea id="rn" maxlength="200" placeholder="Clinic, dose, brand…">${esc(r.notes)}</textarea>
    <p class="muted small" style="margin-top:8px">On the due day you get an alert here${status && status.telegram_configured ? " and on Telegram" : ""} (after 9 am). "Done" moves repeating reminders to their next date.</p>
    <div class="actions"><button>Save</button>${isNew ? "" : '<button type="button" class="danger" id="rem-delete">Delete</button>'}</div>
  </form>`;
  $("rk").onchange = () => { const t = $("rt"); if (!t.value || Object.values(KINDS).some(([, n]) => n === t.value)) t.value = KINDS[$("rk").value][1]; };
  $("rem-cancel").onclick = () => { editingRem = null; loadSettings(); };
  $("rem-form").onsubmit = (e) => { e.preventDefault(); guard(e.submitter, async () => {
    await api("/api/reminders/save", {id: r.id, pet_id: $("rp").value, kind: $("rk").value, title: $("rt").value, due: $("rd").value, repeat_days: +$("rr").value, notes: $("rn").value});
    editingRem = null; toast("Reminder saved ⏰"); await loadSettings(); refresh(); }); };
  if ($("rem-delete")) $("rem-delete").onclick = (e) => { if (confirm("Delete this reminder?")) guard(e.target, async () => {
    await api("/api/reminders/delete", {id: r.id}); editingRem = null; toast("Deleted"); await loadSettings(); refresh(); }); };
  $("rem-editor").scrollIntoView({behavior: "smooth", block: "nearest"});
}
function mirrorStates() {
  const states = status ? status.mirror.states : [];
  const encryption = status ? `<p class="muted small">Encryption: ${esc(status.mirror.encryption)}</p>` : "";
  if (!states.length) return '<p class="muted small">Off · no laptops saved.</p>' + encryption;
  return encryption + states.map((m) => `<div class="item"><span class="pill ${m.live ? "ok" : ""}">${m.live ? "Live" : "Waiting"}</span><div style="flex:1"><b>${esc(m.host)}</b><p class="muted small">${esc(m.state)}</p></div></div>`).join("");
}
async function loadSettings() {
  try { settings = await api("/api/settings"); } catch (e) { return; }
  if (tab !== "settings") return;
  const s = settings, p = s.pet, t = s.telegram, n = s.notifications;
  const modeOptions = (current) => Object.entries(s.modes).map(([k, v]) => `<option value="${k}" ${k === current ? "selected" : ""}>${esc(v)}</option>`).join("");
  const bowls = Object.entries(s.sensors.mapping).filter(([, m]) => m === "eat" || m === "water");
  const NOTE = {entrance: "Someone waiting at the door", access: "Door unlocked by gesture", levels: "Food or water running low", sensors: "Sensor problems", baseline: "Unusual daily routine", reminders: "Care reminders due"};
  $("view").innerHTML = `
    <h2>My pets</h2>
    <div class="pets">${s.pets.map((x) => `<button class="pet-card ${editingPet === x.id ? "selected" : ""}" data-pet="${x.id}">${avatar(x.avatar)}<b>${esc(x.name)}</b><span class="muted small">${x.id === s.monitored_pet ? "📡 Monitored" : esc(x.breed || x.animal || "")}</span></button>`).join("")}
      <button class="pet-card add" data-pet="new">＋<br>Add pet</button></div>
    <p class="muted small" style="margin:0 4px">📡 The sensors can't tell pets apart: live tracking, the wellness score and routine alerts follow the monitored pet.</p>
    <div id="pet-editor"></div>

    <h2>Care reminders</h2>
    <div class="card">${remindersList(s)}
      <div class="actions"><button class="ghost small" data-rem="new">＋ Add reminder</button></div></div>
    <div id="rem-editor"></div>

    <h2>Food & water calibration</h2>
    ${bowls.length ? `<form class="card" id="cal-form">${bowls.map(([id, mode]) => { const c = s.calibration[id] || {}; return `
      <div class="cal-bowl" data-id="${id}">
        <div class="row between"><h3>${STATION[mode]} ${esc(s.modes[mode])} · sensor ${id}</h3><span class="muted small">now: <span data-live="${id}">…</span></span></div>
        <div class="grid">
          <div><label for="full-${id}">When full (cm)</label><div class="cal-row"><input id="full-${id}" name="full" type="number" step="0.1" min="0.1" max="400" value="${c.full_cm ?? ""}" placeholder="—"><button type="button" class="ghost" data-use="full">Use now</button></div></div>
          <div><label for="empty-${id}">When empty (cm)</label><div class="cal-row"><input id="empty-${id}" name="empty" type="number" step="0.1" min="0.1" max="400" value="${c.empty_cm ?? ""}" placeholder="—"><button type="button" class="ghost" data-use="empty">Use now</button></div></div>
        </div>
      </div>`; }).join("")}
      <p class="muted small" style="margin-top:12px">Fill the bowl and tap "Use now" under full, then empty it and tap "Use now" under empty. Leave both blank to skip a bowl.</p>
      <div class="actions"><button>Save calibration</button></div></form>` : '<div class="card"><p class="muted">No sensor is assigned to food or water.</p></div>'}

    <h2>Notifications</h2>
    <div class="card">${Object.keys(n).map((k) => `<label class="check">${esc(NOTE[k] || k)}<input type="checkbox" data-note="${k}" ${n[k] ? "checked" : ""}></label>`).join("")}</div>

    <h2>Telegram</h2>
    <form class="card" id="tg-form">
      <label class="check">Send Telegram messages<input type="checkbox" id="te" ${t.enabled ? "checked" : ""}></label>
      <label for="tc">Chat ID</label><input id="tc" value="${esc(t.chat_id)}" inputmode="numeric">
      <label for="tt">Bot token</label><input id="tt" type="password" autocomplete="off" placeholder="${t.has_token ? "Saved · leave blank to keep" : "Paste the token from @BotFather"}">
      <div class="actions"><button>Save</button><button type="button" class="ghost" id="tg-test">Send test</button></div>
    </form>

    <h2>Sensors</h2>
    <form class="card" id="sensor-form">
      ${s.dashboard_source ? '<p class="muted small">Live readings arrive from the desktop GUI over SSH. Change sensor assignments in the desktop Sensor Hub.</p>' : ''}
      <fieldset ${s.dashboard_source ? 'disabled' : ''} style="border:0;padding:0;margin:0;min-width:0">
      ${Object.entries(s.sensors.mapping).map(([id, mode]) => `<div class="grid"><div><label>Sensor ${id}</label><select name="m${id}">${modeOptions(mode)}</select></div>
        <div><label>Presence below (cm)</label><input name="t${id}" type="number" step="0.5" min="1" max="400" value="${s.sensors.thresholds[id]}"></div></div>`).join("")}
      <p class="muted small" style="margin-top:10px">Sensor 5 is always the entrance gesture sensor. Setup revision ${s.sensors.revision} · ${status && status.link.configured ? "confirmed by the Pi" : "waiting for the Pi"}.</p>
      <div class="actions"><button>Save sensors</button></div>
      </fieldset>
    </form>

    <h2>Sensor locations</h2>
    <form class="card" id="layout-form">
      <p class="muted small">Where each sensor sits on the tray, so the 3D view and the desktop dashboard match the real build.
        Update this whenever a sensor is moved. Left/right 0-10, front/back 0 (front) to 15 (back).</p>
      ${["1", "2", "3", "4", "5"].map((id) => { const place = s.layout[id], role = id === "5" ? "🚪 Entrance" : `${STATION[s.sensors.mapping[id]]} ${esc(s.modes[s.sensors.mapping[id]])}`; return `
      <div class="cal-bowl" data-sensor="${id}">
        <div class="row between"><h3>Sensor ${id} · ${role}</h3><span class="muted small">TRIG ${s.pins[id][0]} / ECHO ${s.pins[id][1]}</span></div>
        <label>Location note</label><input name="note" maxlength="60" value="${esc(place.note)}" placeholder="e.g. Left of the food bowl">
        <div class="grid">
          <div><label>Left ↔ right (0-10)</label><input name="x" type="number" step="any" min="-0.5" max="10.5" value="${place.x}" required></div>
          <div><label>Front ↔ back (0-15)</label><input name="z" type="number" step="any" min="-0.5" max="15.5" value="${place.z}" required></div>
        </div>
        <div class="grid">
          <div><label>Facing</label><select name="facing">${FACINGS.map(([deg, name]) => `<option value="${deg}" ${Math.round(place.facing / 45) * 45 === deg || (deg === 180 && Math.abs(place.facing) === 180) ? "selected" : ""}>${name}</option>`).join("")}</select></div>
          <div><label>Mount</label><select name="mount"><option value="raised" ${place.mount === "raised" ? "selected" : ""}>Raised</option><option value="floor" ${place.mount === "floor" ? "selected" : ""}>Floor</option></select></div>
        </div>
      </div>`; }).join("")}
      <div class="actions"><button>Save locations</button></div>
    </form>

    <h2>Developer dashboard</h2>
    <form class="card" id="mirror-form">
      ${s.dashboard_source ? '<p class="muted small">The desktop GUI is already connected. Additional dashboard mirroring is disabled in this mode.</p>' : ''}
      <fieldset ${s.dashboard_source ? 'disabled' : ''} style="border:0;padding:0;margin:0;min-width:0">
      <p class="small">Also send live readings to the laptop dashboard. On the laptop: Sensor Hub → Live Pi → Start receiver.</p>
      <label for="mh">Laptop IPs, separated by commas (blank = off)</label><input id="mh" value="${esc(s.mirror.hosts.join(", "))}" inputmode="decimal" placeholder="10.156.144.168, 10.192.104.4">
      <label for="mp">Receiver port</label><input id="mp" type="number" min="1" max="65535" value="${s.mirror.port}">
      <div class="list" id="mirror-state" style="margin-top:10px">${mirrorStates()}</div>
      <div class="actions"><button>Save</button></div>
      </fieldset>
    </form>

    <h2>🔐 Encrypted channel</h2>
    <div class="card" id="sec-panel"></div>

    <h2>Account</h2>
    <form class="card" id="pw-form">
      ${status && status.must_change_password ? '<p class="small" style="color:var(--warn)">You are still using the default password. Choose your own below.</p>' : ""}
      <label for="cp">Current password</label><input id="cp" type="password" autocomplete="current-password" required>
      <label for="np">New password (8+ characters)</label><input id="np" type="password" autocomplete="new-password" minlength="8" required>
      <div class="actions"><button>Change password</button><button type="button" class="ghost" id="logout">Sign out</button></div>
    </form>
    <p class="muted small" style="margin:14px 4px">Hub ${status ? (status.link.connected ? "connected to the sensor script" : "waiting for the sensor script") : ""}.</p>`;

  collapseSections(s);
  document.querySelectorAll("[data-pet]").forEach((b) => b.onclick = () => { editingPet = b.dataset.pet; editingRem = null; loadSettings(); });
  document.querySelectorAll("[data-rem]").forEach((b) => b.onclick = () => { editingRem = b.dataset.rem; editingPet = null; loadSettings(); });
  document.querySelectorAll("[data-rem-done]").forEach((b) => b.onclick = () => guard(b, async () => { await api("/api/reminders/done", {id: b.dataset.remDone}); toast("Done 🎉"); loadSettings(); refresh(); }));
  if (editingPet) petEditor(s);
  if (editingRem) reminderEditor(s);
  document.querySelectorAll("#cal-form .cal-bowl").forEach((bowl) => bowl.querySelectorAll("[data-use]").forEach((b) => b.onclick = () => {
    const z = status && status.zones.find((x) => x.sensor_id === bowl.dataset.id);
    if (!z || !z.online) return toast("No live reading from this sensor");
    bowl.querySelector(`[name=${b.dataset.use}]`).value = z.distance_cm.toFixed(1);
  }));
  if ($("cal-form")) $("cal-form").onsubmit = (e) => { e.preventDefault(); guard(e.submitter, async () => {
    const bowls = [...document.querySelectorAll("#cal-form .cal-bowl")].map((b) => ({id: b.dataset.id, name: b.querySelector("h3").textContent,
      full: b.querySelector("[name=full]").value, empty: b.querySelector("[name=empty]").value}));
    const filled = bowls.filter((b) => b.full !== "" || b.empty !== "");
    const half = filled.find((b) => b.full === "" || b.empty === "");
    if (half) throw new Error(`${half.name}: fill in both distances, or leave both blank`);
    if (!filled.length) throw new Error("Enter the full and empty distances first");
    for (const b of filled) await api("/api/settings/calibration", {sensor_id: b.id, full_cm: +b.full, empty_cm: +b.empty});
    toast(`Calibration saved (${filled.length} bowl${filled.length > 1 ? "s" : ""})`); refresh(); }); };
  document.querySelectorAll("[data-note]").forEach((c) => c.onchange = () => api("/api/settings/notifications", {[c.dataset.note]: c.checked}).then(() => toast("Saved")).catch((e) => toast(e.message)));
  $("tg-form").onsubmit = (e) => { e.preventDefault(); guard(e.submitter, async () => {
    await api("/api/settings/telegram", {enabled: $("te").checked, chat_id: $("tc").value, token: $("tt").value}); $("tt").value = ""; toast("Telegram saved"); loadSettings(); }); };
  $("tg-test").onclick = (e) => guard(e.target, async () => { const r = await api("/api/settings/telegram/test", {}); toast(r.ok ? "Test message sent" : r.status); });
  $("sensor-form").onsubmit = (e) => { e.preventDefault(); const f = e.target; guard(e.submitter, async () => {
    const mapping = {}, thresholds = {};
    for (const id of ["1", "2", "3", "4"]) { mapping[id] = f.elements["m" + id].value; thresholds[id] = +f.elements["t" + id].value; }
    await api("/api/settings/sensors", {mapping, thresholds}); toast("Saved · the Pi will apply it in a moment"); loadSettings(); }); };
  $("layout-form").onsubmit = (e) => { e.preventDefault(); guard(e.submitter, async () => {
    const layout = Object.fromEntries([...document.querySelectorAll("[data-sensor]")].map((b) => {
      const v = (name) => b.querySelector(`[name=${name}]`).value;
      // Keep the exact saved angle unless a different direction was picked.
      const facing = +v("facing"), saved = settings.layout[b.dataset.sensor].facing;
      return [b.dataset.sensor, {x: +v("x"), z: +v("z"), facing: Math.round(saved / 45) * 45 === facing ? saved : facing, mount: v("mount"), note: v("note")}];
    }));
    await api("/api/settings/layout", {layout}); toast("Locations saved 📍"); await loadSettings(); refresh(); }); };
  $("mirror-form").onsubmit = (e) => { e.preventDefault(); guard(e.submitter, async () => {
    await api("/api/settings/mirror", {hosts: $("mh").value, port: +$("mp").value}); toast($("mh").value.trim() ? "Saved · connecting to the laptops" : "Dashboard copy turned off"); refresh(); }); };
  $("pw-form").onsubmit =(e) => { e.preventDefault(); guard(e.submitter, async () => {
    await api("/api/account/password", {current: $("cp").value, new: $("np").value}); $("cp").value = $("np").value = ""; toast("Password changed"); refresh(); }); };
  $("logout").onclick = async () => { await api("/api/logout", {}).catch(() => {}); forgetChannel(); showLogin(); };
  securityPanel();
  refresh();
}

// ---------- start ----------
api("/api/session").then((r) => r.user && r.encrypted && channel ? showApp() : (forgetChannel(), showLogin())).catch(showLogin);
</script>
</body>
</html>
